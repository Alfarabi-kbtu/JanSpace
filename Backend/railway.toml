[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Переопределяет CMD из Dockerfile (там "python manage.py runserver" —
# dev-сервер с автоперезагрузкой, для продакшена не годится). entrypoint.sh
# из Dockerfile всё равно выполняется первым (ждёт Postgres, делает
# migrate/collectstatic) — startCommand просто заменяет то, что он
# в итоге запустит через `exec "$@"`.
# $PORT — Railway сам назначает порт и передаёт его в переменной окружения,
# приложение обязано слушать именно его, а не хардкодить 8000
startCommand = "daphne -b 0.0.0.0 -p $PORT config.asgi:application"

healthcheckPath = "/health/"
healthcheckTimeout = 100

# Перезапускать контейнер при падении процесса (например, необработанное
# исключение уронило Daphne) — на Railway это Railway-эквивалент
# "restart: unless-stopped" из docker-compose
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
